name: Moodle 5 regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, soap, zip, gd, sodium, exif
          ini-values: max_input_vars=5000
          coverage: none
      - name: Prepare Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
      - name: PHP syntax
        run: moodle-plugin-ci phplint
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conversation map DOM regressions
        run: |
          npm ci --prefix plugin/tests/javascript --ignore-scripts --no-audit
          npm test --prefix plugin/tests/javascript
      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints
      - name: Moodle regression tests
        run: |
          cd moodle
          vendor/bin/phpunit --configuration phpunit.xml --test-suffix _test.php mod/spatialforum/tests --fail-on-warning --fail-on-notice --display-notices --display-deprecations --display-phpunit-deprecations
